[package]
name = "rodeo-client"
version = "0.1.0"
edition = "2021"
description = "Canonical rodeo client — Studio/VM handles, runCode streaming, RPC dispatch"

[dependencies]
rodeo-proto = { path = "../rodeo-proto" }

connectrpc = { version = "0.3.2", features = ["client", "streaming"] }
buffa = { version = "0.3.0", features = ["json"] }
http = "1"
hyper = { version = "1", features = ["client", "http1"] }

tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

anyhow = "1"
tracing = "0.1"

# Runtime bridge (`--adapter`): the run client relays the script's bridge
# messages to a Lune/Lute process over a localhost websocket, and downloads
# the pinned runtime builds (GitHub release zips) into ~/.rodeo/runtimes.
tokio-tungstenite = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roblox_install = "1"

# rbx-dom (the rodeo-rbx fork, at the same rev as rodeo-cli's): binary <-> XML
# model serialization. Used by roblox.export to emit `.rbxmx` from the binary
# bytes SerializeInstancesAsync produces.
# rbx_binary must be >= 3.0: on 2026-06-30 Studio started storing the Tags
# property in the SharedString index, which 2.x fails to decode
# ("Type mismatch: Property Folder.Tags should be SharedString, but it was Tags").
# The rev must be at or past 3.0.1, whose rbx_reflection_database
# 3.0.1+roblox-741 is the first database that knows Decal/Texture's Emissive*
# properties (#36).
rbx_binary = { git = "https://github.com/rodeo-rbx/rbx-dom", rev = "dbec31dbe6de9bc7d2b6dd78c35bb67b9236ebda" }
rbx_dom_weak = { git = "https://github.com/rodeo-rbx/rbx-dom", rev = "dbec31dbe6de9bc7d2b6dd78c35bb67b9236ebda" }
rbx_xml = { git = "https://github.com/rodeo-rbx/rbx-dom", rev = "dbec31dbe6de9bc7d2b6dd78c35bb67b9236ebda" }

# roblox.capture finalize: decode the engine's PNG, resample to the viewport
# size, re-encode. `image` for the codec, fast_image_resize for a SIMD Lanczos
# (image's own resize is single-threaded scalar and takes many seconds on the
# 15360x8640 frames a 7680-wide capture produces on a 2x display).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fast_image_resize = "6"

# roblox.exportEditableMesh / importEditableMesh: glTF 2.0 reader (`utils` for
# typed accessor readers, `names` for node names; no `import` so no texture
# decoding), base64 for data-URI buffers. Writing is hand-rolled JSON + GLB.
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extras", "KHR_materials_emissive_strength", "KHR_materials_transmission"] }
base64 = "0.22"
# OBJ polygon triangulation, including concave faces and 3D projection.
earcut = "0.4.11"
